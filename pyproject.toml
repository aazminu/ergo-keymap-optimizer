[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ergo-keymap-optimizer"
version = "0.1.0"
description = "Corpus-driven simulated annealing & genetic layout optimizer for split columnar mechanical keyboards (34/36/42-key Corne/Ferris QMK/ZMK keymaps)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Azmi", email = "m4u5t4@u.northwestern.edu" }
]
keywords = ["ergonomics", "mechanical-keyboard", "qmk", "zmk", "corne", "ferris-sweep", "simulated-annealing", "keymap-optimizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.urls]
Homepage = "https://abdullahazmi.com"
Repository = "https://github.com/aazminu/ergo-keymap-optimizer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
